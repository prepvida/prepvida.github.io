<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepVida AI - Login Gateway</title>
    <!-- Direct direct integration script hook placed safely in head layout -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #0070f3; margin-top: 0; font-size: 32px; font-weight: 800; }
        input { width: 100%; padding: 14px; margin: 20px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; background: #0070f3; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #0051b3; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>PrepVida AI</h1>
    <p style="color: #475569; margin: 0; font-size: 15px;">Enter your email to access your mock interview station panel.</p>
    <input type="email" id="loginEmail" placeholder="name@example.com" required>
    <button class="btn" onclick="processSecureLogin()">Verify Account Credentials</button>
</div>

<script>
    let supabaseClient = null;
const DB_URL = "https://supabase.co";
    const DB_PUBLIC_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6cGp4b2xvcHR5Z2Jmanljc3IiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc0MzA3MzA4OCwiZXhwIjoyMDU4NjQ5MDg4fQ.lO2oID66LzUf8Z2_p5K88WJtTz96R9p7Vf55oXjP2xI";

    // FIX: Delay initialization until the page has fully compiled script dependencies
    window.addEventListener('load', () => {
        try {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(DB_URL, DB_PUBLIC_KEY);
            }
        } catch (e) {
            console.error("Initialization error handled safely:", e);
        }
    });

    async function processSecureLogin() {
        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        if (!email) { alert("Please input your registered email address."); return; }

        // Double check connector initialization inside the button runtime trigger frame
        if (!supabaseClient && typeof supabase !== 'undefined') {
            try {
                supabaseClient = supabase.createClient(DB_URL, DB_PUBLIC_KEY);
            } catch (err) { }
        }

        if (!supabaseClient) { 
            // Fallback: If database script delays, force navigation to the subscription hub cleanly anyway
            window.location.href = "dashboard.html";
            return; 
        }

        sessionStorage.setItem('student_email', email);

        try {
            let { data: profile, error } = await supabaseClient
                .from('student_interviews')
                .select('credits_remaining, tier')
                .eq('email', email)
                .maybeSingle();

            if (error) { throw error; }

            // Automatic auto-registration route loops for new students
            if (!profile) {
                const { data: newProfile, error: insertError } = await supabaseClient
                    .from('student_interviews')
                    .insert([{ 
                        email: email, 
                        credits_remaining: 0, 
                        tier: 'basic', 
                        payment_status: 'pending' 
                    }])
                    .select()
                    .maybeSingle();

                if (insertError) { throw insertError; }
                profile = newProfile;
            }

            if (profile && profile.credits_remaining > 0) {
                sessionStorage.setItem('auth_token', 'passed_secure_gate');
                sessionStorage.setItem('active_tier', profile.tier);
                window.location.href = "interview.html";
            } else {
                window.location.href = "dashboard.html";
            }
        } catch (err) {
            console.warn("Handled network delay safely:", err.message);
            window.location.href = "dashboard.html";
        }
    }
</script>
</body>
</html>
