<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepVida AI - Universal Evaluation Workspace</title>
  
  <!-- Fixed Stable Core SDK Drivers -->
  <script src="https://jsdelivr.net"></script>
  <script src="https://cdn.jsdelivr.net/gh/balacodeio/Vapi-Web-UMD@latest/dist/latest/vapi-web-bundle.min.js"></script>

  <!-- Premium Built-In Layout Design (No External CSS to break!) -->
  <style>
    :root {
      --bg-color: #020617;
      --card-bg: #0f172a;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #a855f7;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    /* Auth Card Grid Styles */
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .gradient-text {
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 32px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #020617;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    /* Dashboard Header Styles */
    header {
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: #020617;
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .token-highlight { color: var(--primary); font-weight: 700; }

    .logout-link {
      color: var(--text-muted);
      font-size: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      margin-left: 16px;
    }

    .logout-link:hover { color: var(--text-main); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }

    .panel-title {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }

    .flex-end {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .btn-inline { width: auto; padding: 12px 24px; }

    /* Workspace Architecture layouts */
    .workspace-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    @media (min-width: 1024px) {
      .workspace-layout { grid-template-columns: 2fr 1fr; }
    }

    .recruiter-box {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-text-header { font-size: 0.875rem; font-weight: 600; }

    .timer-badge {
      font-family: monospace;
      background: #020617;
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-body {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-style: italic;
      margin: 24px 0;
    }

    .box-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rounds-caption { font-size: 0.75rem; color: #475569; }

    .syllabus-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    @media (min-width: 480px) {
      .syllabus-grid { grid-template-columns: 1fr 1fr; }
    }

    .syllabus-card {
      background: #0f172a99;
      border: 1px solid #1e293b99;
      padding: 16px;
      border-radius: 12px;
    }

    .round-num { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;}
    .round-title { font-size: 0.875rem; font-weight: 600; }

    .proctor-card { display: flex; flex-direction: column; align-items: center; }
    
    .video-frame {
      width: 100%;
      aspect-ratio: 16/9;
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 166px;
      position: relative;
      overflow: hidden;
    }

    .video-icon { font-size: 2rem; margin-bottom: 8px; color: #334155; }
    .video-desc { font-size: 0.75rem; color: var(--text-muted); text-align: center; }
    
    video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .metrics-list {
      width: 100%;
      margin-top: 16px;
      background: #020617cc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
    }

    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 10px;
    }
    .metric-row:last-child { margin-bottom: 0; }
    .metric-label { color: var(--text-muted); }
    .metric-val-active { color: var(--success); font-weight: 500; }
    .metric-val-locked { color: var(--primary); font-weight: 500; }

    /* Modal Framework Structures */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 850px;
      border-radius: 20px;
      padding: 32px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }

    .modal-header-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }

    .pricing-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin: 32px 0;
    }

    @media (min-width: 768px) {
      .pricing-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    .price-card {
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .price-card.popular {
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
    }

    .popular-tag {
      position: absolute;
      top: 0; right: 16px;
      transform: translateY(-50%);
      background: var(--primary);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 10px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }
